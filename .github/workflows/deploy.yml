name: Deploy Backend a AWS EC2

on:
  push:
    branches:
    - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      run: echo "${{ secrets.ACCESO_DOCKERHUB }}" | docker login -u "${{ secrets.DOCKERHUB_NAME }}" --password-stdin

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKERHUB_NAME }}/back_eval2:latest .

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKERHUB_NAME }}/back_eval2:latest

    
    - name: Prepare and Transfer Image via Bastion
      uses: appleboy/ssh-action@v1.0.3
      with:
          host: ${{ secrets.EC2_FRONT_PUBLIC }}
          username: ${{ secrets.EC2_FRONT_USER }}
          key: ${{ secrets.EC2_FRONT_KEY }}
          script: |
            # 1. Autenticar Docker en el Bastión y descargar la imagen recién subida
            echo "${{ secrets.ACCESO_DOCKERHUB }}" | sudo docker login -u "${{ secrets.DOCKERHUB_NAME }}" --password-stdin
            sudo docker pull ${{ secrets.DOCKERHUB_NAME }}/back_eval2:latest
            
            # 2. Guardar la imagen en un archivo comprimido gzip
            sudo docker save ${{ secrets.DOCKERHUB_NAME }}/back_eval2:latest | gzip > /tmp/back_eval2.tar.gz
            
            # 3. Crear temporalmente el archivo de la llave del Backend en el Bastión para poder hacer SCP
            echo "${{ secrets.EC2_KEY_PEM }}" > /tmp/backend_key.pem
            chmod 400 /tmp/backend_key.pem
            
            # 4. Transferir el archivo comprimido al Backend a través de la red interna de AWS
            scp -i /tmp/backend_key.pem -o StrictHostKeyChecking=no /tmp/back_eval2.tar.gz ${{ secrets.EC2_NAME }}@${{ secrets.EC2_HOST }}:/tmp/back_eval2.tar.gz
            
            # 5. Limpieza de seguridad en el Bastión (eliminar llave y archivo tar)
            rm -f /tmp/backend_key.pem
            rm -f /tmp/back_eval2.tar.gz

    
    - name: Transfer .env file to Backend via Bastion
      uses: appleboy/ssh-action@v1.0.3
      with:
          host: ${{ secrets.EC2_FRONT_PUBLIC }}
          username: ${{ secrets.EC2_FRONT_USER }}
          key: ${{ secrets.EC2_FRONT_KEY }}
          script: |
            # Crear archivo .env en el Bastión
            cat > /tmp/backend.env << 'EOF'
            PORT=3000
            DB_HOST=10.0.141.40
            DB_USER=root
            DB_PASSWORD=Root1234
            DB_NAME=proyecto_db
            DB_PORT=3306
            EOF
            
            # Transferir .env al Backend
            echo "${{ secrets.EC2_KEY_PEM }}" > /tmp/backend_key.pem
            chmod 400 /tmp/backend_key.pem
            scp -i /tmp/backend_key.pem -o StrictHostKeyChecking=no /tmp/backend.env ${{ secrets.EC2_NAME }}@${{ secrets.EC2_HOST }}:/home/ec2-user/.env
            rm -f /tmp/backend_key.pem /tmp/backend.env

    
    - name: Deploy to Backend via Bastion Proxy
      uses: appleboy/ssh-action@v1.0.3
      with:
          
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_NAME }}
          key: ${{ secrets.EC2_KEY_PEM }}
          
          
          proxy_host: ${{ secrets.EC2_FRONT_PUBLIC }}
          proxy_username: ${{ secrets.EC2_FRONT_USER }}
          proxy_key: ${{ secrets.EC2_FRONT_KEY }}
          
          script: |
            # 1. Desempaquetar y cargar la imagen en el Docker local del Backend
            gunzip -c /tmp/back_eval2.tar.gz | sudo docker load
            
            # 2. Limpiar el archivo comprimido para liberar espacio en disco
            rm -f /tmp/back_eval2.tar.gz
            
            # 3. Detener contenedor anterior y arrancar el nuevo
            sudo docker stop backend || true
            sudo docker rm backend || true
            sudo docker run -d \
              -p 3000:3000 \
              --env-file /home/ec2-user/.env \
              --name backend \
              ${{ secrets.DOCKERHUB_NAME }}/back_eval2:latest

    - name: Transfer .env file to Backend via Bastion
      uses: appleboy/ssh-action@v1.0.3
      with:
          host: ${{ secrets.EC2_FRONT_PUBLIC }}
          username: ${{ secrets.EC2_FRONT_USER }}
          key: ${{ secrets.EC2_FRONT_KEY }}
          script: |
            # Crear archivo .env en el Bastión temporalmente
            cat > /tmp/backend.env << 'EOF'
            PORT=3000
            DB_HOST=10.0.141.40
            DB_USER=root
            DB_PASSWORD=Root1234
            DB_NAME=proyecto_db
            DB_PORT=3306
            EOF
            
            # Transferir el .env al Backend
            echo "${{ secrets.EC2_KEY_PEM }}" > /tmp/backend_key.pem
            chmod 400 /tmp/backend_key.pem
            scp -i /tmp/backend_key.pem -o StrictHostKeyChecking=no /tmp/backend.env ${{ secrets.EC2_NAME }}@${{ secrets.EC2_HOST }}:/home/ec2-user/.env
            rm -f /tmp/backend_key.pem /tmp/backend.env